services:
  app:
    image: bellitek-app
    container_name: bellitek_app
    build:
      context: .
      args:
        VITE_APP_URL: https://bellitek.com.ng

    restart: unless-stopped

    # Expose both Laravel (8080) and GeneralClass Java Server (8090)
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8090:8090"

    environment:
      APP_ENV: production
      APP_KEY: base64:z0SyXF9I9F1rWpGKP9z2djYBgvHni6Se10nUQhGLRR4=
      APP_DEBUG: "false"
      APP_URL: https://bellitek.com.ng
      ASSET_URL: https://bellitek.com.ng

      # Java Server Configuration
      PORT: "8090"

      # Database
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: bellitek
      DB_USERNAME: bellitek_user
      DB_PASSWORD: strongpassword1

      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: debug

      # Sessions (419-safe)
      SESSION_DRIVER: database
      SESSION_DOMAIN: .bellitek.com.ng
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax

      # Reverse proxy safety
      TRUSTED_PROXIES: "*"

    depends_on:
      - db

    volumes:
      - bellitek_app_storage:/var/www/app/storage

  db:
    image: postgres:16
    container_name: bellitek_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: bellitek
      POSTGRES_USER: bellitek_user
      POSTGRES_PASSWORD: strongpassword

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - bellitek_db_data:/var/lib/postgresql/data

volumes:
  bellitek_db_data:
    name: bellitek_persistent_db_data

  bellitek_app_storage:
    name: bellitek_persistent_storage
version: '3.8'

